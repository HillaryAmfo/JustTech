{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Just Tech</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="The page you are looking for was not found.">

    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" onerror="this.style.display='none'">

    <script>
        (function() {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ff003c',
                    }
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900 dark:bg-[#0a0a0a] dark:text-white">
    <main class="min-h-screen flex items-center justify-center px-6" aria-label="Page not found">
        <div class="text-center max-w-md">
            <p class="text-primary font-semibold tracking-widest uppercase text-sm mb-4">Error 404</p>
            <h1 class="text-6xl font-extrabold leading-none mb-6">Lost in the signal</h1>
            <p class="text-neutral-500 dark:text-neutral-400 mb-10">
                The page you&rsquo;re looking for doesn&rsquo;t exist or has been moved.
            </p>
            <a href="/" class="inline-flex items-center gap-2 rounded-full bg-primary px-8 py-3 text-sm font-semibold text-white hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 transition">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Back to home
            </a>
        </div>
    </main>
</body>
</html>
