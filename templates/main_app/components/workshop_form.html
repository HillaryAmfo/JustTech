<div id="workshop-form-{{ workshop.id }}" class="mt-4 p-4 bg-gray-800 rounded-lg border border-gray-700">
    <h4 class="font-bold mb-3">Register for {{ workshop.title }}</h4>
    <form hx-post="{% url 'register_workshop' workshop.id %}" hx-target="#workshop-form-{{ workshop.id }}" hx-swap="outerHTML" method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Full Name" required class="form-input text-sm mb-2">
        <input type="email" name="email" placeholder="Email Address" required class="form-input text-sm mb-2">
        <input type="tel" name="phone" placeholder="Phone Number" required class="form-input text-sm mb-2">
        <div class="flex gap-2">
            <button type="submit" class="btn-primary text-sm py-2 px-4 flex-1">Confirm Registration</button>
            <button type="button" class="btn-secondary text-sm py-2 px-4" onclick="this.closest('[id^=workshop-form-]').remove()">Cancel</button>
        </div>
    </form>
</div>
