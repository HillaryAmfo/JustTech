{% load i18n_tags %}
{% if service %}
<div id="service-price-display" class="mt-4 p-4 rounded-xl border border-[#ff003c]/30 bg-[#ff003c]/5">
    <p class="text-sm text-neutral-600 dark:text-gray-400 mb-1">{{ service.name }}</p>
    <p class="text-2xl font-semibold text-[#ff003c]">{{ service.starting_price|default:'Contact us for pricing'|tr }}</p>
</div>
{% else %}
<div id="service-price-display"></div>
{% endif %}
