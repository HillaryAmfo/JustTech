{% load i18n_tags %}
<div id="booking-form-container" class="lg:col-span-3">
    <div class="rounded-3xl border border-green-500/40 bg-green-500/5 p-8 md:p-12 text-center" role="status">
        <div class="w-16 h-16 rounded-full bg-green-500/15 flex items-center justify-center mx-auto mb-6" aria-hidden="true">
            <i class="fas fa-check text-green-500 text-2xl"></i>
        </div>
        <h3 id="booking-success-title" tabindex="-1" class="text-2xl md:text-3xl font-semibold text-neutral-900 dark:text-white mb-4">
            {{ 'Booking request received'|tr }}
        </h3>
        <p class="text-neutral-600 dark:text-neutral-400 leading-relaxed max-w-md mx-auto mb-8">
            {{ 'Your booking request has been received. JustTech will review the details and the next step will be discussed with you.'|tr }}
        </p>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-3">
            <a href="{% url 'home' %}" class="btn-primary text-sm px-7 py-3">
                <i class="fas fa-home" aria-hidden="true"></i>
                {{ 'Return home'|tr }}
            </a>
            <a href="{% url 'services' %}" class="btn-secondary text-sm px-7 py-3">{{ 'Explore services'|tr }}</a>
            <a href="{% url 'contact' %}" class="btn-secondary text-sm px-7 py-3">{{ 'Contact us'|tr }}</a>
        </div>
    </div>
</div>
<script>
    (function () {
        window.setTimeout(function () {
            const title = document.getElementById('booking-success-title');
            if (title) title.focus({ preventScroll: true });
        }, 0);
    })();
</script>
