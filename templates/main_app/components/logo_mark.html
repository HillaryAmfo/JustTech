{% comment %} JustTech logo mark — red lightning bolt the full height of the J, J formed by two wire plugs meeting at the middle. {% endcomment %}
<svg class="jt-logo-mark" viewBox="0 0 164 166" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <!-- Electric power symbol — Font Awesome classic bolt-lightning (red), as tall as the J, sitting in front -->
    <g transform="translate(4 38) scale(0.2422)">
        <g class="jt-mark-power">
            <path d="M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-1.7 275.2 9.5 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z" fill="#ff003c"/>
        </g>
    </g>
    <!-- Upper plug: short top bar + shoulder, leads down to connector -->
    <g class="jt-plug-top">
        <path d="M90 44 L120 44 Q148 42 148 60 L148 80" stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none"/>
        <rect x="139" y="80" width="18" height="18" rx="5" fill="currentColor"/>
        <rect x="143.5" y="98" width="3" height="5" rx="1.5" fill="currentColor"/>
        <rect x="149.5" y="98" width="3" height="5" rx="1.5" fill="currentColor"/>
    </g>
    <!-- Lower plug: connector + stem + hook, plugs into the upper half at the middle -->
    <g class="jt-plug-bottom">
        <rect x="139" y="103" width="18" height="18" rx="5" fill="currentColor"/>
        <path d="M148 121 L148 132 Q148 150 135 153 Q122 156 118 147" stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
</svg>
